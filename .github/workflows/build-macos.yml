name: build-macos

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  bundle:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          uv sync
      - name: Build .app
        run: uv run pyinstaller packaging/macos.spec --noconfirm --distpath dist --workpath build
      - name: Archive
        run: ditto -c -k --keepParent "dist/КУ ОТИК.app" kuotik-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: kuotik-macos
          path: kuotik-macos.zip
          retention-days: 30
