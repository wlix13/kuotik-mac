name: 🏗️ Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: 🏗️ Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: ${{ matrix.os }}
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Build
        run: uv run --group dev pyinstaller packaging/macos.spec --noconfirm --distpath dist --workpath build

      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        env:
          KUOTIK_SELFTEST: "1"
          QT_QPA_PLATFORM: offscreen
        run: '"dist/КУ ОТИК.app/Contents/MacOS/kuotik"'

      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        env:
          KUOTIK_SELFTEST: "1"
          QT_QPA_PLATFORM: offscreen
        run: dist/kuotik/kuotik

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        env:
          KUOTIK_SELFTEST: "1"
          QT_QPA_PLATFORM: offscreen
        run: .\dist\kuotik\kuotik.exe

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent "dist/КУ ОТИК.app" kuotik-macos.zip

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf kuotik-linux.tar.gz -C dist kuotik

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/kuotik -DestinationPath kuotik-windows.zip

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kuotik-${{ matrix.os }}
          path: |
            kuotik-macos.zip
            kuotik-linux.tar.gz
            kuotik-windows.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: 📦 Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@28ab305d0ffa26d60ec4bd614126329e26c7a0ec # v3.0.4
        with:
          files: artifacts/*
          fail_on_unmatched_files: true
          generate_release_notes: true
