[project]
name = "kuotik-mac"
version = "1.0.0"
description = "КУ ОТИК (Delphi 7, ТИК) для macOS: работы 1-3, справка внутри приложения"
requires-python = ">=3.12"
dependencies = [
    "pyside6>=6.7",
    "numpy>=1.26",
    "matplotlib>=3.8",
]

[project.scripts]
kuotik = "kuotik_port.app:main"

[dependency-groups]
dev = [
    "pyinstaller>=6.6",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kuotik_port"]

[tool.hatch.build.targets.wheel.force-include]
"kuotik_port/assets/help.zip" = "kuotik_port/assets/help.zip"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E402"]

[tool.ruff.lint.per-file-ignores]
# математика перенесена из расчётов лабораторных как есть, правки только по смыслу
"kuotik_port/mathlib/*" = ["E741", "E501"]
